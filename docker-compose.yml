version: "3.9"

services:
  backend:
    build:
      context: ./app-manager
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/systemd:/run/systemd
      - ./app-manager/config.yaml:/etc/app-manager/config.yaml:ro
    environment:
      - APP_MANAGER_CONFIG=/etc/app-manager/config.yaml
      - APP_MANAGER_JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - APP_MANAGER_AUTH_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - APP_MANAGER_ADDR=:8080
    env_file:
      - .env

  frontend:
    build:
      context: ./manager-frontend-app
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
